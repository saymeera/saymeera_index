<div class="row g-0 dashboard-section p-4">

  <h5 class="mb-3">Market Dashboard</h5>

  <div class="col-md-3" *ngFor="let c of [1,2,3,4]">
    <div class="card p-3">
      <small>NIFTY 50</small>
      <h4>22,040</h4>
      <span class="text-success">+0.7%</span>
    </div>
  </div>

  <div class="col-lg-8 mt-4">
    <table class="table table-hover">
      <tr><th>COMPANY</th><th>LTP</th><th>%</th></tr>
      <tr><td>RELIANCE</td><td>2950</td><td class="text-success">+2.4%</td></tr>
    </table>
  </div>

  <div class="col-lg-4 mt-4">
    <div class="card p-3 text-center">
      <h4 class="text-success">BULLISH</h4>
      <button class="btn btn-outline-danger">View Analysis</button>
    </div>
  </div>

</div>
